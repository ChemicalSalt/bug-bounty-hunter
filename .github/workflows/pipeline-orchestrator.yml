name: Pipeline Orchestrator

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 5'

permissions:
  contents: write
  actions: write

jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Weekly Vet (chains to recon, which chains to scanners)
        run: gh workflow run weekly-vet.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
