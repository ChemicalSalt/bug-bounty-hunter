name: Triday Scan
on:
  schedule:
    - cron: '30 18 * * 2-4'   # 12:00am IST Wed-Fri
  workflow_dispatch:
    inputs:
      runner:
        description: 'Where to run'
        type: choice
        options:
          - github
          - self-hosted
        default: github

concurrency:
  group: bug-bounty-pipeline
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      has_hosts: ${{ steps.split.outputs.has_hosts }}
      has_403: ${{ steps.split.outputs.has_403 }}
      has_404: ${{ steps.split.outputs.has_404 }}
      num_batches_main: ${{ steps.split.outputs.num_batches_main }}
      num_batches_403: ${{ steps.split.outputs.num_batches_403 }}
      num_batches_404: ${{ steps.split.outputs.num_batches_404 }}
      num_batches_subzy: ${{ steps.split.outputs.num_batches_subzy }}
      batches_main: ${{ steps.split.outputs.batches_main }}
      batches_403: ${{ steps.split.outputs.batches_403 }}
      batches_404: ${{ steps.split.outputs.batches_404 }}
      batches_subzy: ${{ steps.split.outputs.batches_subzy }}
    steps:
      - name: Checkout domains branch
        uses: actions/checkout@v4
        with:
          ref: domains
          fetch-depth: 1

      - name: Checkout status checker from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: checker
          fetch-depth: 1

      - name: Build full host lists
        run: |
          touch live_hosts.txt new_live_hosts.txt live_hosts_403.txt live_hosts_404.txt

          > combined_full.txt
          if [ -s new_live_hosts.txt ]; then
            cat new_live_hosts.txt >> combined_full.txt
          fi
          if [ -s live_hosts.txt ]; then
            if [ -s new_live_hosts.txt ]; then
              comm -23 <(sort live_hosts.txt) <(sort new_live_hosts.txt) >> combined_full.txt || true
            else
              cat live_hosts.txt >> combined_full.txt
            fi
          fi

          export HACKERONE_TOKEN="${{ secrets.HACKERONE_TOKEN }}"
          export INTIGRITI_TOKEN="${{ secrets.INTIGRITI_TOKEN }}"
          export MAPPING_CSV_PATH="checker/domain_program_map.csv"
          export EXCLUDED_OUTPUT_PATH="excluded_domains.txt"
          export HACKERONE_SCOPE_OUTPUT_PATH="hackerone_scope.txt"
          export INTIGRITI_SCOPE_OUTPUT_PATH="intigriti_scope.txt"
          export YESWEHACK_SCOPE_OUTPUT_PATH="yeswehack_scope.txt"
          export BUGCROWD_SCOPE_OUTPUT_PATH="bugcrowd_scope.txt"
          pip install tldextract --break-system-packages
          python3 checker/check_program_open.py

          if [ -s excluded_domains.txt ]; then
            > exclude_grep.txt
            while IFS= read -r d; do
              [ -z "$d" ] && continue
              escaped=$(echo "$d" | sed 's/\./\\./g')
              echo "\\.${escaped}\$|^${escaped}\$" >> exclude_grep.txt
            done < excluded_domains.txt

            for f in combined_full.txt live_hosts_403.txt live_hosts_404.txt; do
              grep -vEf exclude_grep.txt "$f" > "${f}.filtered" || cp "$f" "${f}.filtered"
              mv "${f}.filtered" "$f"
            done
          fi

          if [ -f checker/filter_to_scope.py ]; then
            for sf in hackerone_scope.txt intigriti_scope.txt yeswehack_scope.txt bugcrowd_scope.txt; do
              cp "checker/$sf" "$sf" 2>/dev/null || true
            done
            for f in combined_full.txt live_hosts_403.txt live_hosts_404.txt; do
              SCOPE_FILTER_INPUT="$f" SCOPE_FILTER_OUTPUT="$f" python3 checker/filter_to_scope.py
            done
          fi

          echo "Full main list: $(wc -l < combined_full.txt)"
          echo "Full 403 list: $(wc -l < live_hosts_403.txt)"
          echo "Full 404 list: $(wc -l < live_hosts_404.txt)"

      - name: Compute windows for all 4 stages
        id: split
        run: |
          target_per_batch=10
          max_batches=256
          chunk_size=$(( target_per_batch * max_batches ))

          compute_stage () {
            stage_name=$1
            full_list=$2
            out_prefix=$3

            full_total=$(wc -l < "$full_list")
            touch "${stage_name}_offset.txt" "${stage_name}_progress.txt"

            if [ "$full_total" -eq 0 ]; then
              echo "has_${out_prefix}=false" >> $GITHUB_OUTPUT
              echo "batches_${out_prefix}=[]" >> $GITHUB_OUTPUT
              echo "num_batches_${out_prefix}=0" >> $GITHUB_OUTPUT
              return
            fi

            offset=$(cat "${stage_name}_offset.txt" 2>/dev/null)
            if [ -z "$offset" ] || [ "$offset" -gt "$full_total" ]; then
              offset=1
            fi

            chunk_end=$(( offset + chunk_size - 1 ))
            if [ "$chunk_end" -gt "$full_total" ]; then
              chunk_end=$full_total
            fi

            sed -n "${offset},${chunk_end}p" "$full_list" > "${stage_name}_chunk.txt"
            total=$(wc -l < "${stage_name}_chunk.txt")

            num_batches=$(( (total + target_per_batch - 1) / target_per_batch ))
            if [ "$num_batches" -gt $max_batches ]; then num_batches=$max_batches; fi
            if [ "$num_batches" -lt 1 ]; then num_batches=1; fi

            done_batches=$(cut -d: -f1 "${stage_name}_progress.txt" | sort -un)
            batches=$(seq 1 "$num_batches" | grep -vFx "$done_batches" | jq -R . | jq -sc . 2>/dev/null || echo "[]")
            if [ -z "$done_batches" ]; then
              batches=$(seq 1 "$num_batches" | jq -R . | jq -sc .)
            fi

            if [ "$(echo "$done_batches" | grep -c .)" -ge "$num_batches" ] && [ -n "$done_batches" ]; then
              echo "$stage_name: chunk fully done, advancing offset"
              new_offset=$(( chunk_end + 1 ))
              if [ "$new_offset" -gt "$full_total" ]; then new_offset=1; fi
              echo "$new_offset" > "${stage_name}_offset.txt"
              > "${stage_name}_progress.txt"
              batches=$(seq 1 "$num_batches" | jq -R . | jq -sc .)
            fi

            echo "has_${out_prefix}=true" >> $GITHUB_OUTPUT
            echo "batches_${out_prefix}=$batches" >> $GITHUB_OUTPUT
            echo "num_batches_${out_prefix}=$num_batches" >> $GITHUB_OUTPUT
            echo "$stage_name: $total hosts this window, $num_batches batches, remaining: $(echo "$batches" | jq 'length')"
            cp "${stage_name}_chunk.txt" "${out_prefix}_chunk.txt"
          }

          compute_stage "triday_main" "combined_full.txt" "main"
          compute_stage "triday_403" "live_hosts_403.txt" "403"
          compute_stage "triday_404" "live_hosts_404.txt" "404"
          compute_stage "triday_subzy" "combined_full.txt" "subzy"

      - name: Upload chunk host lists
        uses: actions/upload-artifact@v4
        with:
          name: triday-chunks
          path: |
            main_chunk.txt
            403_chunk.txt
            404_chunk.txt
            subzy_chunk.txt
          retention-days: 7

  daily_main:
    needs: prepare
    if: needs.prepare.outputs.has_hosts == 'true' && needs.prepare.outputs.batches_main != '[]'
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 420
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches_main) }}
    steps:
      - name: Checkout main branch script
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_scripts
          fetch-depth: 1

      - name: Download chunk host list
        uses: actions/download-artifact@v4
        with:
          name: triday-chunks

      - name: Slice hosts for this batch
        run: |
          total=$(wc -l < main_chunk.txt)
          num_batches=${{ needs.prepare.outputs.num_batches_main }}
          batch_num=${{ matrix.batch }}
          batch_size=$(( (total + num_batches - 1) / num_batches ))
          start=$(( (batch_num - 1) * batch_size + 1 ))
          end=$(( batch_num * batch_size ))
          sed -n "${start},${end}p" main_chunk.txt > input.txt
          echo "Batch $batch_num/$num_batches: $(wc -l < input.txt) hosts"

      - name: Pre-filter dead hosts
        run: |
          cat input.txt | xargs -P 30 -I @@H@@ bash -c 'code=$(curl -s -o /dev/null -m 2 -w "%{http_code}" "@@H@@" 2>/dev/null || echo 000); if [ "$code" != "000" ]; then echo "@@H@@"; fi' > input_live.txt || true
          if [ -s input_live.txt ]; then mv input_live.txt input.txt; fi

      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT

      - name: Cache Go tools
        uses: actions/cache@v4
        id: cache-go
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-v4

      - name: Install nuclei
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Ensure nuclei installed
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          command -v nuclei &>/dev/null || go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

      - name: Cache nuclei templates
        uses: actions/cache@v4
        id: cache-templates
        with:
          path: ~/.local/share/nuclei-templates
          key: nuclei-templates-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: nuclei-templates-${{ runner.os }}-

      - name: Download nuclei templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/.local/share/nuclei-templates
          git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates.git $HOME/.local/share/nuclei-templates || true

      - name: Run nuclei
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          TEMPLATES_DIR="$HOME/.local/share/nuclei-templates"
          touch results.txt
          if [ ! -s input.txt ]; then echo "No targets"; exit 0; fi

          CVE_PATHS=""
          for year in 2022 2023 2024 2025; do
            [ -d "$TEMPLATES_DIR/http/cves/$year" ] && CVE_PATHS="$CVE_PATHS,$TEMPLATES_DIR/http/cves/$year"
          done
          CVE_PATHS="${CVE_PATHS#,}"
          TEMPLATE_PATHS="$CVE_PATHS,$TEMPLATES_DIR/http/misconfiguration,$TEMPLATES_DIR/http/exposed-panels"

          set +e
          timeout 20700 nuclei -l input.txt \
            -t "$TEMPLATE_PATHS" \
            -itags cve,cors,panel,admin \
            -etags ssl,tls,http-missing-headers,tech,info,dns,helpers,passive \
            -severity medium,high,critical \
            -H "User-Agent: Mozilla/5.0 BugBounty/42 (YWH) Chemical Oxidizer CS_YWH/BB" \
            -H "X-Bug-Bounty: HackerOne-Chemical, HackerOne-Oxidizer" \
            -H "X-Bugcrowd-Research: Chemical, Oxidizer" \
            -H "X-Intigriti-Research: Chemical, Oxidizer" \
            -H "X-YesWeHack-Research: Chemical, Oxidizer" \
            -silent -retries 0 -timeout 3 -bulk-size 5 -concurrency 5 \
            -rate-limit 5 -fhr -max-host-error 30 \
            -no-color -o results.txt -je nuclei_findings.json -irr
          NUCLEI_EXIT=$?
          if [ "$NUCLEI_EXIT" -eq 124 ]; then
            echo "::error::Nuclei timed out - batch will NOT be marked done"
            exit 1
          fi
          grep -E "\[(medium|high|critical)\]" results.txt > results_filtered.txt 2>/dev/null || true
          mv results_filtered.txt results.txt
          echo "Findings: $(wc -l < results.txt)"

      - name: Checkout domains branch (seen findings)
        uses: actions/checkout@v4
        with:
          ref: domains
          path: domains_data
          fetch-depth: 1

      - name: Filter against previously seen findings
        run: |
          touch domains_data/seen_findings_main.txt
          comm -23 <(sort -u results.txt) <(sort -u domains_data/seen_findings_main.txt) > new_results.txt || true
          echo "New: $(wc -l < new_results.txt)"

      - name: Check for results
        id: check
        run: |
          if [ -s new_results.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$(wc -l < new_results.txt)" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Build detailed email body
        if: steps.check.outputs.found == 'true'
        run: python3 main_scripts/build_email_body.py || cp new_results.txt new_results_detailed.txt

      - name: Send email alert
        if: steps.check.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "[Daily Main ${{ matrix.batch }}] ${{ steps.check.outputs.count }} New Finding(s)"
          body: file://new_results_detailed.txt
          to: ${{ secrets.EMAIL_TO }}
          from: BugBountyBot

      - name: Mark batch complete
        if: success()
        run: echo "${{ matrix.batch }}" > batch_marker.txt

      - name: Upload batch completion marker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-marker-main-${{ matrix.batch }}
          path: batch_marker.txt
          retention-days: 1

      - name: Upload batch findings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-findings-main-${{ matrix.batch }}
          path: results.txt
          retention-days: 1

  finalize_main:
    needs: [prepare, daily_main]
    if: always()
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout domains branch
        uses: actions/checkout@v4
        with:
          ref: domains
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Download markers
        uses: actions/download-artifact@v4
        with:
          path: markers
          pattern: batch-marker-main-*
        continue-on-error: true
      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          path: findings
          pattern: batch-findings-main-*
        continue-on-error: true
      - name: Merge progress + seen findings, advance offset if done
        run: |
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          touch triday_main_progress.txt triday_main_offset.txt seen_findings_main.txt

          for d in markers/batch-marker-main-*; do
            [ -d "$d" ] || continue
            num=$(basename "$d" | sed -E 's/^batch-marker-main-([0-9]+)$/\1/')
            echo "$num" >> triday_main_progress.txt
          done
          sort -un triday_main_progress.txt -o triday_main_progress.txt

          for d in findings/batch-findings-main-*; do
            [ -d "$d" ] && [ -f "$d/results.txt" ] && cat "$d/results.txt" >> seen_findings_main.txt
          done
          sort -u seen_findings_main.txt -o seen_findings_main.txt

          num_batches="${{ needs.prepare.outputs.num_batches_main }}"
          done_count=$(wc -l < triday_main_progress.txt)
          echo "Done: $done_count / $num_batches"

          git add triday_main_progress.txt triday_main_offset.txt seen_findings_main.txt
          git diff --staged --quiet || git commit -m "Daily main progress update $(date +'%Y-%m-%d %H:%M')"
          git push origin domains || (git pull --rebase origin domains && git push origin domains) || echo "::warning::push failed"

  bypass_403:
    needs: [prepare, finalize_main]
    if: always() && !cancelled() && needs.prepare.outputs.has_403 == 'true' && needs.prepare.outputs.batches_403 != '[]'
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 420
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches_403) }}
    steps:
      - name: Checkout main branch script
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_scripts
          fetch-depth: 1
      - name: Download chunk host list
        uses: actions/download-artifact@v4
        with:
          name: triday-chunks
      - name: Slice hosts for this batch
        run: |
          total=$(wc -l < 403_chunk.txt)
          num_batches=${{ needs.prepare.outputs.num_batches_403 }}
          batch_num=${{ matrix.batch }}
          batch_size=$(( (total + num_batches - 1) / num_batches ))
          start=$(( (batch_num - 1) * batch_size + 1 ))
          end=$(( batch_num * batch_size ))
          sed -n "${start},${end}p" 403_chunk.txt > input_403.txt
      - name: Pre-filter dead hosts
        run: |
          cat input_403.txt | xargs -P 30 -I @@H@@ bash -c 'code=$(curl -s -o /dev/null -m 2 -w "%{http_code}" "@@H@@" 2>/dev/null || echo 000); if [ "$code" != "000" ]; then echo "@@H@@"; fi' > input_403_live.txt || true
          if [ -s input_403_live.txt ]; then mv input_403_live.txt input_403.txt; fi
      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT
      - name: Cache Go tools
        uses: actions/cache@v4
        id: cache-go
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-v4
      - name: Install nuclei
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
      - name: Ensure nuclei installed
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          command -v nuclei &>/dev/null || go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
      - name: Cache nuclei templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nuclei-templates
          key: nuclei-templates-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: nuclei-templates-${{ runner.os }}-
      - name: Download nuclei templates
        run: |
          mkdir -p $HOME/.local/share/nuclei-templates
          if [ ! -d "$HOME/.local/share/nuclei-templates/http" ]; then
            git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates.git $HOME/.local/share/nuclei-templates || true
          fi
      - name: Run 403 bypass scan
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          TEMPLATES_DIR="$HOME/.local/share/nuclei-templates"
          touch results.txt
          if [ ! -s input_403.txt ]; then echo "No targets"; exit 0; fi
          set +e
          timeout 20700 nuclei -l input_403.txt \
            -t "$TEMPLATES_DIR/http/misconfiguration" \
            -itags 403 \
            -etags ssl,tls,http-missing-headers,tech,info,dns,helpers,passive \
            -severity medium,high,critical \
            -H "User-Agent: Mozilla/5.0 BugBounty/42 (YWH) Chemical Oxidizer CS_YWH/BB" \
            -H "X-Bug-Bounty: HackerOne-Chemical, HackerOne-Oxidizer" \
            -H "X-Bugcrowd-Research: Chemical, Oxidizer" \
            -H "X-Intigriti-Research: Chemical, Oxidizer" \
            -H "X-YesWeHack-Research: Chemical, Oxidizer" \
            -silent -retries 0 -timeout 3 -bulk-size 5 -concurrency 5 \
            -rate-limit 5 -fhr -max-host-error 30 \
            -no-color -o results.txt -je nuclei_findings.json -irr
          NUCLEI_EXIT=$?
          if [ "$NUCLEI_EXIT" -eq 124 ]; then
            echo "::error::Nuclei timed out - batch will NOT be marked done"
            exit 1
          fi
          grep -E "\[(medium|high|critical)\]" results.txt > results_filtered.txt 2>/dev/null || true
          mv results_filtered.txt results.txt
      - name: Checkout domains branch (seen findings)
        uses: actions/checkout@v4
        with:
          ref: domains
          path: domains_data
          fetch-depth: 1
      - name: Filter against previously seen findings
        run: |
          touch domains_data/seen_findings_403.txt
          comm -23 <(sort -u results.txt) <(sort -u domains_data/seen_findings_403.txt) > new_results.txt || true
      - name: Check for results
        id: check
        run: |
          if [ -s new_results.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$(wc -l < new_results.txt)" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi
      - name: Build detailed email body
        if: steps.check.outputs.found == 'true'
        run: python3 main_scripts/build_email_body.py || cp new_results.txt new_results_detailed.txt
      - name: Send email alert
        if: steps.check.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "[403 Bypass ${{ matrix.batch }}] ${{ steps.check.outputs.count }} New Finding(s)"
          body: file://new_results_detailed.txt
          to: ${{ secrets.EMAIL_TO }}
          from: BugBountyBot
      - name: Mark batch complete
        if: success()
        run: echo "${{ matrix.batch }}" > batch_marker.txt
      - name: Upload batch completion marker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-marker-403-${{ matrix.batch }}
          path: batch_marker.txt
          retention-days: 1
      - name: Upload batch findings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-findings-403-${{ matrix.batch }}
          path: results.txt
          retention-days: 1

  finalize_403:
    needs: [prepare, bypass_403]
    if: always()
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout domains branch
        uses: actions/checkout@v4
        with:
          ref: domains
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Download markers
        uses: actions/download-artifact@v4
        with:
          path: markers
          pattern: batch-marker-403-*
        continue-on-error: true
      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          path: findings
          pattern: batch-findings-403-*
        continue-on-error: true
      - name: Merge progress + seen findings
        run: |
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          touch triday_403_progress.txt triday_403_offset.txt seen_findings_403.txt
          for d in markers/batch-marker-403-*; do
            [ -d "$d" ] || continue
            num=$(basename "$d" | sed -E 's/^batch-marker-403-([0-9]+)$/\1/')
            echo "$num" >> triday_403_progress.txt
          done
          sort -un triday_403_progress.txt -o triday_403_progress.txt
          for d in findings/batch-findings-403-*; do
            [ -d "$d" ] && [ -f "$d/results.txt" ] && cat "$d/results.txt" >> seen_findings_403.txt
          done
          sort -u seen_findings_403.txt -o seen_findings_403.txt
          git add triday_403_progress.txt triday_403_offset.txt seen_findings_403.txt
          git diff --staged --quiet || git commit -m "403 bypass progress update $(date +'%Y-%m-%d %H:%M')"
          git push origin domains || (git pull --rebase origin domains && git push origin domains) || echo "::warning::push failed"

  takeover:
    needs: [prepare, finalize_403]
    if: always() && !cancelled() && needs.prepare.outputs.has_404 == 'true' && needs.prepare.outputs.batches_404 != '[]'
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 420
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches_404) }}
    steps:
      - name: Checkout main branch script
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_scripts
          fetch-depth: 1
      - name: Download chunk host list
        uses: actions/download-artifact@v4
        with:
          name: triday-chunks
      - name: Slice hosts for this batch
        run: |
          total=$(wc -l < 404_chunk.txt)
          num_batches=${{ needs.prepare.outputs.num_batches_404 }}
          batch_num=${{ matrix.batch }}
          batch_size=$(( (total + num_batches - 1) / num_batches ))
          start=$(( (batch_num - 1) * batch_size + 1 ))
          end=$(( batch_num * batch_size ))
          sed -n "${start},${end}p" 404_chunk.txt > input_404.txt
      - name: Get week number
        id: date
        run: echo "week=$(date +'%Y-%U')" >> $GITHUB_OUTPUT
      - name: Cache Go tools
        uses: actions/cache@v4
        id: cache-go
        with:
          path: ~/go/bin
          key: go-tools-subzy-${{ runner.os }}-v4
      - name: Install nuclei
        if: steps.cache-go.outputs.cache-hit != 'true'
        run: go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
      - name: Ensure nuclei installed
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          command -v nuclei &>/dev/null || go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
      - name: Cache nuclei templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/nuclei-templates
          key: nuclei-templates-${{ runner.os }}-${{ steps.date.outputs.week }}
          restore-keys: nuclei-templates-${{ runner.os }}-
      - name: Download nuclei templates
        run: |
          mkdir -p $HOME/.local/share/nuclei-templates
          if [ ! -d "$HOME/.local/share/nuclei-templates/http" ]; then
            git clone --depth 1 https://github.com/projectdiscovery/nuclei-templates.git $HOME/.local/share/nuclei-templates || true
          fi
      - name: Run takeover scan
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          TEMPLATES_DIR="$HOME/.local/share/nuclei-templates"
          touch results.txt
          if [ ! -s input_404.txt ]; then echo "No targets"; exit 0; fi
          set +e
          timeout 20700 nuclei -l input_404.txt \
            -t "$TEMPLATES_DIR/http/takeovers" \
            -itags takeover,subdomain-takeover \
            -etags ssl,tls,http-missing-headers,tech,info,dns,helpers,passive \
            -severity medium,high,critical \
            -H "User-Agent: Mozilla/5.0 BugBounty/42 (YWH) Chemical Oxidizer CS_YWH/BB" \
            -H "X-Bug-Bounty: HackerOne-Chemical, HackerOne-Oxidizer" \
            -H "X-Bugcrowd-Research: Chemical, Oxidizer" \
            -H "X-Intigriti-Research: Chemical, Oxidizer" \
            -H "X-YesWeHack-Research: Chemical, Oxidizer" \
            -silent -retries 0 -timeout 3 -bulk-size 5 -concurrency 5 \
            -rate-limit 5 -fhr -max-host-error 30 \
            -no-color -o results.txt -je nuclei_findings.json -irr
          NUCLEI_EXIT=$?
          if [ "$NUCLEI_EXIT" -eq 124 ]; then
            echo "::error::Nuclei timed out - batch will NOT be marked done"
            exit 1
          fi
          grep -E "\[(medium|high|critical)\]" results.txt > results_filtered.txt 2>/dev/null || true
          mv results_filtered.txt results.txt
      - name: Checkout domains branch (seen findings)
        uses: actions/checkout@v4
        with:
          ref: domains
          path: domains_data
          fetch-depth: 1
      - name: Filter against previously seen findings
        run: |
          touch domains_data/seen_findings_takeover.txt
          comm -23 <(sort -u results.txt) <(sort -u domains_data/seen_findings_takeover.txt) > new_results.txt || true
      - name: Check for results
        id: check
        run: |
          if [ -s new_results.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$(wc -l < new_results.txt)" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi
      - name: Build detailed email body
        if: steps.check.outputs.found == 'true'
        run: python3 main_scripts/build_email_body.py || cp new_results.txt new_results_detailed.txt
      - name: Send email alert
        if: steps.check.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "[Takeover ${{ matrix.batch }}] ${{ steps.check.outputs.count }} New Finding(s)"
          body: file://new_results_detailed.txt
          to: ${{ secrets.EMAIL_TO }}
          from: BugBountyBot
      - name: Mark batch complete
        if: success()
        run: echo "${{ matrix.batch }}" > batch_marker.txt
      - name: Upload batch completion marker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-marker-takeover-${{ matrix.batch }}
          path: batch_marker.txt
          retention-days: 1
      - name: Upload batch findings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-findings-takeover-${{ matrix.batch }}
          path: results.txt
          retention-days: 1

  finalize_takeover:
    needs: [prepare, takeover]
    if: always()
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout domains branch
        uses: actions/checkout@v4
        with:
          ref: domains
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Download markers
        uses: actions/download-artifact@v4
        with:
          path: markers
          pattern: batch-marker-takeover-*
        continue-on-error: true
      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          path: findings
          pattern: batch-findings-takeover-*
        continue-on-error: true
      - name: Merge progress + seen findings
        run: |
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          touch triday_404_progress.txt triday_404_offset.txt seen_findings_takeover.txt
          for d in markers/batch-marker-takeover-*; do
            [ -d "$d" ] || continue
            num=$(basename "$d" | sed -E 's/^batch-marker-takeover-([0-9]+)$/\1/')
            echo "$num" >> triday_404_progress.txt
          done
          sort -un triday_404_progress.txt -o triday_404_progress.txt
          for d in findings/batch-findings-takeover-*; do
            [ -d "$d" ] && [ -f "$d/results.txt" ] && cat "$d/results.txt" >> seen_findings_takeover.txt
          done
          sort -u seen_findings_takeover.txt -o seen_findings_takeover.txt
          git add triday_404_progress.txt triday_404_offset.txt seen_findings_takeover.txt
          git diff --staged --quiet || git commit -m "Takeover progress update $(date +'%Y-%m-%d %H:%M')"
          git push origin domains || (git pull --rebase origin domains && git push origin domains) || echo "::warning::push failed"

  subzy_takeover:
    needs: [prepare, finalize_takeover]
    if: always() && !cancelled() && needs.prepare.outputs.has_hosts == 'true' && needs.prepare.outputs.batches_subzy != '[]'
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    timeout-minutes: 420
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJson(needs.prepare.outputs.batches_subzy) }}
    steps:
      - name: Download chunk host list
        uses: actions/download-artifact@v4
        with:
          name: triday-chunks
      - name: Slice hosts for this batch
        run: |
          total=$(wc -l < subzy_chunk.txt)
          num_batches=${{ needs.prepare.outputs.num_batches_subzy }}
          batch_num=${{ matrix.batch }}
          batch_size=$(( (total + num_batches - 1) / num_batches ))
          start=$(( (batch_num - 1) * batch_size + 1 ))
          end=$(( batch_num * batch_size ))
          sed -n "${start},${end}p" subzy_chunk.txt > input_subzy.txt
      - name: Cache Go tools
        uses: actions/cache@v4
        id: cache-go-subzy
        with:
          path: ~/go/bin
          key: go-tools-subzy-${{ runner.os }}-v1
      - name: Install subzy
        if: steps.cache-go-subzy.outputs.cache-hit != 'true'
        run: go install -v github.com/PentestPad/subzy@latest
      - name: Ensure subzy installed
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          command -v subzy &>/dev/null || go install -v github.com/PentestPad/subzy@latest
      - name: Run subzy takeover scan
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          touch subzy_results.txt
          if [ -s input_subzy.txt ]; then
            set +e
            timeout 20700 subzy run --targets input_subzy.txt --hide_fails --verify_ssl --concurrency 5 -o subzy_results.txt
            SUBZY_EXIT=$?
            if [ "$SUBZY_EXIT" -eq 124 ]; then
              echo "::error::Subzy timed out - batch will NOT be marked done"
              exit 1
            fi
          fi
      - name: Checkout domains branch (seen findings)
        uses: actions/checkout@v4
        with:
          ref: domains
          path: domains_data
          fetch-depth: 1
      - name: Filter against previously seen findings
        run: |
          touch domains_data/seen_findings_subzy.txt
          comm -23 <(sort -u subzy_results.txt) <(sort -u domains_data/seen_findings_subzy.txt) > new_subzy_results.txt || true
      - name: Check for results
        id: check
        run: |
          if [ -s new_subzy_results.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "count=$(wc -l < new_subzy_results.txt)" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi
      - name: Send email alert
        if: steps.check.outputs.found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "[Subzy Takeover ${{ matrix.batch }}] ${{ steps.check.outputs.count }} New Finding(s)"
          body: file://new_subzy_results.txt
          to: ${{ secrets.EMAIL_TO }}
          from: BugBountyBot
      - name: Mark batch complete
        if: success()
        run: echo "${{ matrix.batch }}" > batch_marker.txt
      - name: Upload batch completion marker
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-marker-subzy-${{ matrix.batch }}
          path: batch_marker.txt
          retention-days: 1
      - name: Upload batch findings
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: batch-findings-subzy-${{ matrix.batch }}
          path: subzy_results.txt
          retention-days: 1

  finalize_subzy:
    needs: [prepare, subzy_takeover]
    if: always()
    runs-on: ${{ github.event.inputs.runner == 'self-hosted' && fromJson('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - name: Checkout domains branch
        uses: actions/checkout@v4
        with:
          ref: domains
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Download markers
        uses: actions/download-artifact@v4
        with:
          path: markers
          pattern: batch-marker-subzy-*
        continue-on-error: true
      - name: Download findings
        uses: actions/download-artifact@v4
        with:
          path: findings
          pattern: batch-findings-subzy-*
        continue-on-error: true
      - name: Merge progress + seen findings
        run: |
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          touch triday_subzy_progress.txt triday_subzy_offset.txt seen_findings_subzy.txt
          for d in markers/batch-marker-subzy-*; do
            [ -d "$d" ] || continue
            num=$(basename "$d" | sed -E 's/^batch-marker-subzy-([0-9]+)$/\1/')
            echo "$num" >> triday_subzy_progress.txt
          done
          sort -un triday_subzy_progress.txt -o triday_subzy_progress.txt
          for d in findings/batch-findings-subzy-*; do
            [ -d "$d" ] && [ -f "$d/subzy_results.txt" ] && cat "$d/subzy_results.txt" >> seen_findings_subzy.txt
          done
          sort -u seen_findings_subzy.txt -o seen_findings_subzy.txt
          git add triday_subzy_progress.txt triday_subzy_offset.txt seen_findings_subzy.txt
          git diff --staged --quiet || git commit -m "Subzy progress update $(date +'%Y-%m-%d %H:%M')"
          git push origin domains || (git pull --rebase origin domains && git push origin domains) || echo "::warning::push failed"
