name: Weekend Vet
# ─────────────────────────────────────────────────────────────────────────────
# SCHEDULE: every Saturday, 00:00 IST (Friday 18:30 UTC)
# Runs discover_all_programs.py per platform, sequentially (not parallel,
# to avoid contending Mistral's 4 req/min rate limit across jobs).
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bbh-pipeline
  cancel-in-progress: false

env:
  HACKERONE_TOKEN: ${{ secrets.HACKERONE_TOKEN }}
  INTIGRITI_TOKEN: ${{ secrets.INTIGRITI_TOKEN }}
  HACKENPROOF_AUTH: ${{ secrets.HACKENPROOF_AUTH }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  OUTPUT_DIR: ${{ github.workspace }}
  MAPPING_CSV_PATH: ${{ github.workspace }}/domain_program_map.csv
  EXCLUDED_OUTPUT_PATH: ${{ github.workspace }}/excluded_domains.txt

jobs:
  vet_hackerone_shard1:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: data, path: domains-branch, fetch-depth: 0 }
      - run: pip install tldextract --break-system-packages
      - env:
          DOMAINS_TXT_PATH: ${{ github.workspace }}/domains-branch/domains.txt
        run: python3 discover_all_programs.py --platform hackerone --shard 1/4
      - uses: actions/upload-artifact@v4
        with: { name: hackerone-shard-1-results, path: hackerone_shard_1_results.json, retention-days: 1 }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-vet-logs-hackerone-shard-1
          path: |
            mistral_review_log.txt
            mistral_429_debug.log
            mistral_parse_fail_debug.log
          retention-days: 30

  vet_hackerone_shard2:
    needs: vet_hackerone_shard1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: data, path: domains-branch, fetch-depth: 0 }
      - run: pip install tldextract --break-system-packages
      - env:
          DOMAINS_TXT_PATH: ${{ github.workspace }}/domains-branch/domains.txt
        run: python3 discover_all_programs.py --platform hackerone --shard 2/4
      - uses: actions/upload-artifact@v4
        with: { name: hackerone-shard-2-results, path: hackerone_shard_2_results.json, retention-days: 1 }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-vet-logs-hackerone-shard-2
          path: |
            mistral_review_log.txt
            mistral_429_debug.log
            mistral_parse_fail_debug.log
          retention-days: 30

  vet_hackerone_shard3:
    needs: vet_hackerone_shard2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: data, path: domains-branch, fetch-depth: 0 }
      - run: pip install tldextract --break-system-packages
      - env:
          DOMAINS_TXT_PATH: ${{ github.workspace }}/domains-branch/domains.txt
        run: python3 discover_all_programs.py --platform hackerone --shard 3/4
      - uses: actions/upload-artifact@v4
        with: { name: hackerone-shard-3-results, path: hackerone_shard_3_results.json, retention-days: 1 }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-vet-logs-hackerone-shard-3
          path: |
            mistral_review_log.txt
            mistral_429_debug.log
            mistral_parse_fail_debug.log
          retention-days: 30

  vet_hackerone_shard4:
    needs: vet_hackerone_shard3
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
