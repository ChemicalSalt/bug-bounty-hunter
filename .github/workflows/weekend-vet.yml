        run: python3 discover_all_programs.py --platform hackerone --shard 4/4
      - uses: actions/upload-artifact@v4
        with: { name: hackerone-shard-4-results, path: hackerone_shard_4_results.json, retention-days: 1 }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-vet-logs-hackerone-shard-4
          path: |
            mistral_review_log.txt
            mistral_429_debug.log
            mistral_parse_fail_debug.log
          retention-days: 30

  vet_hackerone_merge:
    needs: vet_hackerone_shard4
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { ref: data, path: domains-branch, fetch-depth: 0 }
      - run: pip install tldextract --break-system-packages
      - uses: actions/download-artifact@v4
        with:
          pattern: hackerone-shard-*-results
          merge-multiple: true
      - name: Refuse to merge partial data
        run: |
          missing=0
          for i in 1 2 3 4; do
            if [ ! -f "hackerone_shard_${i}_results.json" ]; then
              echo "::error::hackerone_shard_${i}_results.json missing - that shard failed or timed out"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo "::error::Not all HackerOne shards completed"; exit 1; }
      - env:
          DOMAINS_TXT_PATH: ${{ github.workspace }}/domains-branch/domains.txt
        run: python3 discover_all_programs.py --platform hackerone --merge-shards 4
      - env:
          DOMAINS_TXT_PATH: ${{ github.workspace }}/domains-branch/domains.txt
        run: python3 validate_pipeline.py --platform hackerone
      - name: Commit mistral cache and stats (always, even on validation failure)
        if: always()
        run: |
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          for f in mistral_ban_cache.json discovery_stats.csv; do
            git add -f "$f" 2>/dev/null || echo "::warning::Skipped staging $f"
          done
          git diff --staged --quiet || git commit -m "Weekend vet (hackerone) - cache/stats $(date +'%Y-%m-%d')"
          git push origin main || (git pull --rebase --autostash origin main && git push origin main) || { echo "::error::Push to main failed"; exit 1; }
      - name: Commit scope/domain output (only if discover+validate succeeded)
        if: success()
        run: |
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          for f in domain_program_map.csv excluded_domains.txt \
            hackerone_scope.txt hackerone_scope_diff.log hackerone_excluded_full.txt hackerone_skipped_full.txt; do
            git add -f "$f" 2>/dev/null || echo "::warning::Skipped staging $f"
          done
          git diff --staged --quiet || git commit -m "Weekend vet (hackerone) $(date +'%Y-%m-%d')"
          git push origin main || (git pull --rebase --autostash origin main && git push origin main) || { echo "::error::Push to main failed"; exit 1; }
      - name: Commit domains branch
        if: success()
        run: |
          cd domains-branch
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          git add -f domains.txt domains_diff.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Weekend vet (hackerone): rebuild domains.txt $(date +'%Y-%m-%d')"
          git push origin data || (git pull --rebase --autostash origin data && git push origin data) || { echo "::error::Push to data failed"; exit 1; }

