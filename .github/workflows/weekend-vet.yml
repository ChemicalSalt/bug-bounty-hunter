          git push origin main || (git pull --rebase --autostash origin main && git push origin main) || { echo "::error::Push to main failed"; exit 1; }
      - name: Commit scope/domain output (only if discover+validate succeeded)
        if: success()
        run: |
          git config --global user.email "bugbountybot@github.com"
          git config --global user.name "BugBountyBot"
          for f in domain_program_map.csv excluded_domains.txt \
            intigriti_scope.txt intigriti_scope_diff.log intigriti_excluded_full.txt intigriti_skipped_full.txt; do
