id: coupon-promo-logic-flaw

info:
  name: Coupon/Promo Code Server-Side Validation Bypass
  author: Oxidizer
  severity: medium
  description: >
    Detects coupon/promo validation endpoints that accept an obviously
    non-existent or malformed code as valid, indicating missing
    server-side existence/format validation. Detection-only (single
    POST probe), no exploitation.
  tags: custom,business-logic,coupon

http:
  - method: POST
    path:
      - "{{BaseURL}}/api/coupon/validate"
      - "{{BaseURL}}/api/promo/apply"
      - "{{BaseURL}}/api/cart/coupon"
      - "{{BaseURL}}/api/checkout/coupon"
      - "{{BaseURL}}/cart/coupon/apply"

    headers:
      Content-Type: application/json

    body: |
      {"code":"NUCLEITEST-NONEXISTENT-CODE-XYZ99{{randstr}}"}

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "application/json"

      - type: word
        part: body
        words:
          - "\"valid\":true"
          - "\"applied\":true"
          - "\"success\":true"
          - "discount_applied"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "invalid"
          - "not found"
          - "does not exist"
          - "expired"
          - "error"
          - "\"valid\":false"
