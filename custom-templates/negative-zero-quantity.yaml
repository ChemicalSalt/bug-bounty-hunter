id: negative-zero-quantity-manipulation

info:
  name: Cart Quantity Manipulation - Negative/Zero Value Accepted
  author: Oxidizer
  severity: medium
  description: >
    Detects cart/booking endpoints that accept a negative or zero
    item quantity without server-side validation, indicating logic
    that could be abused to reduce or invert order totals. Detection-only
    (single POST probe), no exploitation, no actual order placed.
  tags: custom,business-logic,quantity-manipulation

http:
  - method: POST
    path:
      - "{{BaseURL}}/api/cart/add"
      - "{{BaseURL}}/api/cart/update"
      - "{{BaseURL}}/api/booking/quantity"
      - "{{BaseURL}}/cart/update-quantity"
      - "{{BaseURL}}/api/cart/item/update"

    headers:
      Content-Type: application/json

    body: |
      {"quantity":-1,"item_id":1}

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "application/json"

      - type: word
        part: body
        words:
          - "\"quantity\":-1"
          - "\"quantity\":0"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "invalid"
          - "must be positive"
          - "must be greater than"
          - "must be at least"
          - "validation error"
          - "bad request"
          - "error"
