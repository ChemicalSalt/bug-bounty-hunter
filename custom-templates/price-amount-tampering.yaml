id: price-amount-tampering

info:
  name: Price/Amount Parameter Tampering - Negative Value Accepted
  author: Oxidizer
  severity: medium
  description: >
    Detects checkout/cart/booking endpoints that accept a negative
    price/amount value without server-side validation, indicating
    client-trusted pricing logic. Detection-only (single POST probe
    with a negative amount), no exploitation, no actual order placed.
  tags: custom,business-logic,price-tampering

http:
  - method: POST
    path:
      - "{{BaseURL}}/api/cart/update"
      - "{{BaseURL}}/api/checkout/calculate"
      - "{{BaseURL}}/api/booking/price"
      - "{{BaseURL}}/api/cart/item"
      - "{{BaseURL}}/cart/update-price"

    headers:
      Content-Type: application/json

    body: |
      {"amount":-1,"price":-1,"quantity":1}

    matchers-condition: and
    matchers:
      - type: word
        part: header
        words:
          - "application/json"

      - type: word
        part: body
        words:
          - "\"amount\":-1"
          - "\"price\":-1"
          - "\"total\":-1"
          - "\"success\":true"
        condition: or

      - type: word
        part: body
        negative: true
        words:
          - "invalid"
          - "must be positive"
          - "must be greater than"
          - "validation error"
          - "bad request"
          - "error"
